<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ქუთაისის საერთაშორისო უნივერსიტეტი</title>
    <link rel="preconnect" href="https://img.youtube.com" crossorigin>
    <link
      rel="preload"
      href="/fonts/UcCo3FwrK3iLTcviYwY.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/PlIVFke5O6RzLfvNNVSitxkr76PRHBC4Ytyq-Gof7PUs4S7zcGyUkdjo.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link href="/fonts.css" rel="stylesheet" />
    <style>
      .initial-loader {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #fff;
      }

      .initial-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid #e5e7eb;
        border-top-color: #3C70AF;
        border-radius: 50%;
        animation: initial-spin 0.8s linear infinite;
      }

      @keyframes initial-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader">
        <div class="initial-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
